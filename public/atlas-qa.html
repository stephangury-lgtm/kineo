<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kineo IFMK Atlas QA</title><style>body{font-family:system-ui;margin:0;background:#f6f8fa;color:#17212b}main{max-width:1200px;margin:auto;padding:24px}h1{margin:0 0 8px}.note{margin:0 0 24px;color:#59636e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#fff;border:1px solid #d8dee4;border-radius:16px;padding:12px;box-shadow:0 4px 14px #0000000a}.card h2{font-size:15px;margin:0 0 8px}.card img{display:block;width:100%;height:260px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid #edf0f2}.card p{font-size:12px;color:#667085;margin:8px 0 0}@media(max-width:520px){main{padding:12px}.card img{height:220px}}</style></head><body><main><h1>Atlas IFMK — QA preview</h1><p class="note">Page temporaire de contrôle visuel. Les questions restent non publiées.</p><div class="grid" id="grid"></div></main><script>const assets=[['hip-femur-proximal','CM1 p34'],['hip-femoral-head','CM1 p35'],['hip-sartorius','CM2 p14'],['hip-gluteal','CM2 p37'],['hip-piriformis','CM2 p57'],['knee-patella','CM3 p18'],['knee-menisci','CM3 p42'],['knee-lca','CM3 p53'],['knee-lcp','CM3 p54'],['knee-vastus-medial','CM4 p13'],['knee-vastus-lateral','CM4 p14'],['ankle-tibia-distal','CM6 p12'],['ankle-fibula-distal','CM6 p20'],['ankle-talus','CM6 p27'],['ankle-lcf','CM6 p49'],['ankle-lct','CM6 p51'],['foot-navicular','CM8 p6'],['foot-cuboid','CM8 p8'],['foot-tarsus-labeling','CM8 p8'],['foot-cuneiforms','CM8 p12'],['foot-hallux','CM8 p17'],['foot-m5','CM8 p22']];document.getElementById('grid').innerHTML=assets.map(([name,src])=>`<article class="card"><h2>${name}</h2><img src="/quiz-assets/ifmk/${name}.svg" alt="${name}" loading="lazy"><p>${src}</p></article>`).join('')</script></body></html>
