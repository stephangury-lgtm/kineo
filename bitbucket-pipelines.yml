# Kineo CI
image: node:22

pipelines:
  branches:
    main:
      - step:
          name: Build Kineo
          caches:
            - node
          script:
            - npm install
            - npm run build
          artifacts:
            - dist/**
    "kineo/frontend-v2":
      - step:
          name: Build Kineo
          caches:
            - node
          script:
            - npm install
            - npm run build
          artifacts:
            - dist/**
