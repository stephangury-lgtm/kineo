name: Deploy Kineo to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed version
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const expected=process.env.EXPECTED_SHA.slice(0,7)
          const url=`https://kineo.stephangury.workers.dev/version.json?verify=${Date.now()}`
          let last=''
          for(let attempt=1;attempt<=6;attempt++){
            const response=await fetch(url,{cache:'no-store'})
            if(response.ok){
              const data=await response.json()
              last=JSON.stringify(data)
              if(data.commit?.startsWith(expected) || data.version?.endsWith(expected)){
                console.log(`Verified deployed version ${data.version}`)
                process.exit(0)
              }
            }
            await new Promise(resolve=>setTimeout(resolve,3000))
          }
          console.error(`Cloudflare version mismatch. Expected ${expected}, got ${last || 'no response'}`)
          process.exit(1)
          NODE
