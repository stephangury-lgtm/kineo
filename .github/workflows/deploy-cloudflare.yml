name: Deploy Kineo to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kineo-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Critical source invariants
        run: npm run check:source

      - name: Unit regression checks
        run: npm run test:unit

      - name: Production content health gate
        run: npm run check:health

      - name: Anonymous RPC security contracts
        run: npm run check:security

      - name: Build
        run: npm run build

      - name: Production build smoke checks
        run: node scripts/check-build.mjs

      - name: Preview route checks
        run: node scripts/check-preview.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser regressions before publication
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/leryko-preview.log 2>&1 &
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.5
          done
          npx playwright test tests/e2e/public-smoke.spec.mjs tests/e2e/audit-regressions.spec.mjs --project=chromium --reporter=line

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production routes and deployed version
        id: production_smoke
        continue-on-error: true
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npm run check:prod; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Roll back failed production deployment
        if: steps.production_smoke.outcome == 'failure'
        run: |
          npx wrangler rollback --message "Automatic rollback after failed Kineo production smoke check"
          sleep 5
          KINEO_BASE_URL=https://kineo.stephangury.workers.dev npm run check:prod

      - name: Fail workflow after rollback
        if: steps.production_smoke.outcome == 'failure'
        run: |
          echo "Production smoke checks failed. Previous Cloudflare version was restored."
          exit 1
