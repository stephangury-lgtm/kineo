name: Kineo Production Authenticated Smoke

on:
  workflow_run:
    workflows: ["Deploy Kineo to Cloudflare"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: kineo-production-auth-smoke
  cancel-in-progress: true

jobs:
  production-authenticated:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Playwright runner
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Verify production revision before authenticated checks
        env:
          KINEO_BASE_URL: https://kineo.stephangury.workers.dev
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: npm run check:prod

      - name: Create isolated production E2E accounts
        env:
          BROKER_URL: https://kimtiyuytikyseuzmjbv.supabase.co/functions/v1/e2e-session-broker
          BROWSER_SUFFIX: ${{ matrix.browser }}
        run: |
          OIDC_RESPONSE=$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kineo-e2e")
          OIDC_TOKEN=$(node -e "const x=JSON.parse(process.argv[1]);process.stdout.write(x.value)" "$OIDC_RESPONSE")
          CREATE_BODY=$(node -e "process.stdout.write(JSON.stringify({action:'create',suffix:process.argv[1]}))" "$BROWSER_SUFFIX")
          CREATE_RESPONSE=$(curl --fail --silent --show-error -X POST "$BROKER_URL" -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" --data "$CREATE_BODY")
          USER_ID=$(node -e "const x=JSON.parse(process.argv[1]);process.stdout.write(x.user_id)" "$CREATE_RESPONSE")
          EMAIL=$(node -e "const x=JSON.parse(process.argv[1]);process.stdout.write(x.email)" "$CREATE_RESPONSE")
          PASSWORD=$(node -e "const x=JSON.parse(process.argv[1]);process.stdout.write(x.password)" "$CREATE_RESPONSE")
          FRIEND_USER_ID=$(node -e "const x=JSON.parse(process.argv[1]);process.stdout.write(x.friend_user_id)" "$CREATE_RESPONSE")
          FRIEND_USERNAME=$(node -e "const x=JSON.parse(process.argv[1]);process.stdout.write(x.friend_username)" "$CREATE_RESPONSE")
          FRIEND_EMAIL=$(node -e "const x=JSON.parse(process.argv[1]);process.stdout.write(x.friend_email)" "$CREATE_RESPONSE")
          FRIEND_PASSWORD=$(node -e "const x=JSON.parse(process.argv[1]);process.stdout.write(x.friend_password)" "$CREATE_RESPONSE")
          echo "::add-mask::$EMAIL"
          echo "::add-mask::$PASSWORD"
          echo "::add-mask::$FRIEND_EMAIL"
          echo "::add-mask::$FRIEND_PASSWORD"
          echo "KINEO_E2E_USER_ID=$USER_ID" >> "$GITHUB_ENV"
          echo "KINEO_E2E_FRIEND_USER_ID=$FRIEND_USER_ID" >> "$GITHUB_ENV"
          echo "KINEO_E2E_FRIEND_USERNAME=$FRIEND_USERNAME" >> "$GITHUB_ENV"
          echo "KINEO_E2E_FRIEND_EMAIL=$FRIEND_EMAIL" >> "$GITHUB_ENV"
          echo "KINEO_E2E_FRIEND_PASSWORD=$FRIEND_PASSWORD" >> "$GITHUB_ENV"
          echo "KINEO_E2E_EMAIL=$EMAIL" >> "$GITHUB_ENV"
          echo "KINEO_E2E_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Run authenticated journeys against production
        env:
          KINEO_E2E_BASE_URL: https://kineo.stephangury.workers.dev
        run: npx playwright test tests/e2e/authenticated-critical.spec.mjs --project=${{ matrix.browser }} --reporter=line

      - name: Upload production Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-auth-${{ matrix.browser }}-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Delete isolated production E2E accounts
        if: always() && env.KINEO_E2E_USER_ID != ''
        env:
          BROKER_URL: https://kimtiyuytikyseuzmjbv.supabase.co/functions/v1/e2e-session-broker
        run: |
          OIDC_RESPONSE=$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kineo-e2e")
          OIDC_TOKEN=$(node -e "const x=JSON.parse(process.argv[1]);process.stdout.write(x.value)" "$OIDC_RESPONSE")
          for USER_ID in "$KINEO_E2E_USER_ID" "$KINEO_E2E_FRIEND_USER_ID"; do
            test -n "$USER_ID" || continue
            CLEANUP_BODY=$(node -e "process.stdout.write(JSON.stringify({action:'cleanup',user_id:process.argv[1]}))" "$USER_ID")
            curl --fail --silent --show-error -X POST "$BROKER_URL" -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" --data "$CLEANUP_BODY"
          done
