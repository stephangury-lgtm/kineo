name: Restore an exact Leryko Cloudflare version
on:
  workflow_dispatch:
    inputs:
      version_id:
        description: Cloudflare version UUID from release-before.json
        required: true
        type: string
      expected_commit:
        description: Full frontend commit SHA from the same snapshot
        required: true
        type: string
      interface:
        description: Interface of the target version
        type: choice
        options: [legacy, preview, v5]
        default: legacy
permissions:
  contents: read
concurrency:
  group: kineo-production
  cancel-in-progress: false
jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate explicit rollback target
        run: node scripts/release-safety.mjs validate-target
        env:
          TARGET_VERSION: ${{ inputs.version_id }}
          TARGET_COMMIT: ${{ inputs.expected_commit }}
      - name: Restore captured Cloudflare version
        run: npx wrangler rollback "$TARGET_VERSION" --yes --message "Owner-requested Leryko rollback to a recorded version"
        env:
          TARGET_VERSION: ${{ inputs.version_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify restored commit, interface, routes and assets
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npm run check:prod; then exit 0; fi
            sleep 3
          done
          exit 1
        env:
          EXPECTED_SHA: ${{ inputs.expected_commit }}
          EXPECTED_INTERFACE: ${{ inputs.interface }}
