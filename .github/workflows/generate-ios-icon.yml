name: Generate Kineo iOS Icon
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-ios-icon.yml'
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate Apple touch icon
        run: |
          convert -background white public/icons/kineo-launch.svg -resize 180x180 public/icons/apple-touch-icon-180.png
      - name: Commit icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icons/apple-touch-icon-180.png
          git diff --cached --quiet || git commit -m "feat: update iOS app icon"
          git push
