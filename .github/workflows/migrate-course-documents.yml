name: Course documents migration
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview without modifying Storage or database"
        required: true
        type: boolean
        default: true
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-auth requests
      - name: Migrate verified Drive PDFs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/migrate-course-documents.py
