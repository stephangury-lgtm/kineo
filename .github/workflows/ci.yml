name: Kineo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kineo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Approved GURIKO PWA assets
        run: node scripts/check-guriko-release.mjs

      - name: Critical source invariants
        run: npm run check:source

      - name: Unit regression checks
        run: npm run test:unit

      - name: Production content health gate
        run: npm run check:health

      - name: Anonymous RPC security contracts
        run: npm run check:security

      - name: TypeScript and production build
        run: npm run build

      - name: Production build smoke checks
        run: node scripts/check-build.mjs

      - name: Preview route checks
        run: node scripts/check-preview.mjs

      - name: Install Chromium test browser
        run: npx playwright install --with-deps chromium

      - name: Start regression preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/leryko-preview.log 2>&1 &
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/leryko-preview.log
          exit 1

      - name: Public and audit browser regressions
        run: npx playwright test tests/e2e/public-smoke.spec.mjs tests/e2e/pwa-startup-cache.spec.mjs tests/e2e/startup-session.spec.mjs tests/e2e/audit-regressions.spec.mjs tests/e2e/single-correction.spec.mjs --project=chromium --reporter=line

      - name: Build opt-in V5 preview for isolated regression tests
        run: npm run build
        env:
          VITE_ENABLE_V5_PREVIEW: 'true'

      - name: V5 browser regressions with mocked APIs only
        run: npx playwright test tests/e2e/v5-interface.spec.mjs tests/e2e/feedback-daily.spec.mjs tests/e2e/pdf-reader.spec.mjs tests/e2e/mobile-feedback.spec.mjs tests/e2e/route-readiness.spec.mjs tests/e2e/resume-progress.spec.mjs tests/e2e/daily-resume.spec.mjs tests/e2e/guriko-identity.spec.mjs tests/e2e/duel-rivalries.spec.mjs tests/e2e/duel-messages.spec.mjs --project=chromium --reporter=line
        env:
          LERYKO_TEST_V5: '1'
