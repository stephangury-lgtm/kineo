name: Kineo Browser Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kineo-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Install pinned Playwright runner
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/kineo-preview.log 2>&1 &
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/kineo-preview.log
          exit 1

      - name: Mobile browser and PWA smoke tests
        env:
          KINEO_E2E_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/public-smoke.spec.mjs --reporter=line
